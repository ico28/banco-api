services:
  db:
    image: postgres:16
    container_name: banco-db
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
    ports:
      - "5433:5432"
    volumes:
      - banco-data:/var/lib/postgresql/data
  
  adminer:
    image: adminer
    container_name: banco-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  banco-data: