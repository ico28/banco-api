services:
  db:
    image: postgres:16
    container_name: banco-db
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: ${DB_PASSWORD:-banco}
    ports:
      - "5433:5432"
    volumes:
      - banco-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banco -d banco"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: banco-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/banco
      DB_USER: banco
      DB_PASSWORD: ${DB_PASSWORD:-banco}
    ports:
      - "8080:8080"

volumes:
  banco-data: